<!-- Placeholder to preserve document flow on mobile so content below is not pushed -->
<div class="h-19 lg:hidden"></div>

<nav class="fixed inset-x-0 z-50 top-0 flex flex-col lg:flex-row lg:justify-between lg:items-center p-3 lg:bg-transparent lg:backdrop-blur-[32px]
  font-radio transition-all duration-500 ease-in-out origin-top opacity-0 animate-slide-in"
  [class.bg-white]="isNavbarVisable" [class.bg-transparent]="!isNavbarVisable">
  <div class="flex justify-between items-center w-full lg:w-auto">
    <h1 class="font-bold text-2xl tracking-tighter">Aetherfield</h1>
    <i class="lg:hidden! text-3xl cursor-pointer" [class]="isNavbarVisable ? 'pi pi-times' : 'pi pi-plus'"
      (click)="toogleNavbarvisablity()"></i>
  </div>
  <ul class="flex flex-col overflow-hidden text-3xl font-medium
           max-lg:transition-all max-lg:duration-500 ease-in-out
           lg:flex-row lg:gap-5 lg:text-lg lg:max-h-none lg:mt-0
           lg:opacity-100 lg:visible lg:translate-y-0 lg:overflow-visible" [class.max-h-0]="!isNavbarVisable"
    [class.max-h-[500px]]="isNavbarVisable" [class.opacity-0]="!isNavbarVisable" [class.opacity-100]="isNavbarVisable"
    [class.invisible]="!isNavbarVisable" [class.visible]="isNavbarVisable" [class.-translate-y-6]="!isNavbarVisable"
    [class.translate-y-0]="isNavbarVisable" [class.mt-6]="isNavbarVisable">
    @for (link of navbarLinks; track link.path; let isLast = $last) {
    @if (isLast) {
    <div
      class="group cursor-pointer flex items-center justify-center gap-1 text-white lg:text-black bg-black lg:bg-transparent p-4 lg:p-0 text-center hover:opacity-70 transition-opacity duration-150">
      <li>
        <a [routerLink]="link.path">{{link.label}}</a>
      </li>
      <i class="hidden! lg:block! pi pi-arrow-right transition-transform duration-200 group-hover:translate-x-1.5"></i>
    </div>
    }
    @else {
    <li class="lg:py-0 py-6 border-b lg:border-none border-b-gray-100 hover:opacity-70 transition-opacity duration-150">
      <a [routerLink]="link.path">{{ link.label }}</a>
    </li>
    }
    }
  </ul>
</nav>
