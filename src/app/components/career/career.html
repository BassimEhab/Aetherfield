<section class="fixed inset-0  h-full bg-light-blue -z-10"></section>

<section class="my-20 opacity-0 animate-slide-up">
    <!-- Back To Careers -->
    <div class="flex text-center justify-center items-center gap-1">
        <i class="pi pi-arrow-left"></i>
        <a routerLink="/careers" class="font-source-serif font-normal leading-[1.2] text-[40px] tracking-[-4%]">Back to
            Careers</a>
    </div>
</section>
<section
    class="my-10 p-10 mx-10 max-w-230 lg:mx-auto flex flex-col gap-10 bg-white rounded-2xl opacity-0 animation-slow-slide-up">
    <!-- Header -->
    <div class="p-6 bg-white flex lg:flex-row flex-col items-start lg:justify-between gap-6 border-b border-gray-200">
        <div class="flex flex-col max-w-154 gap-6">
            <!-- Job Title -->
            <div class="flex flex-col">
                <h2 class="font-radio font-medium text-[40px] leading-none tracking-[-2%]">{{career()?.title}}</h2>
                <p
                    class="font-geist-mono font-normal text-[14px] leading-none mt-2 text-gray-500 flex items-center gap-2">
                    <span>{{career()?.roleType}}</span>
                    <span class="-translate-y-1/5">.</span>
                    <span>{{career()?.location}}</span>
                </p>
            </div>
            <!-- Job Short Description -->
            <p class="font-source-serif font-normal text-[20px] leading-[1.2] tracking-[-4%]">
                {{career()?.shortDescription}}</p>
        </div>
        <app-button buttonText="View role" [hideDot]="true"></app-button>
    </div>
    <!-- Body -->
    <div class="py-6 flex flex-col gap-16 border-b border-gray-200">
        @for (careerBody of career()?.jobDescription; track career()?.id) {

        <div class="flex flex-col gap-6">
            <p class="font-radio leading-none tracking-[-2%] font-medium text-[20px]">{{careerBody.title}}</p>
            <p class="font-source-serif leading-[1.4] tracking-[-4%] text-[20px] font-normal">{{careerBody.body}}</p>
        </div>
        }
    </div>
    <!--  -->
    <app-call-to-action actionButton="Apply now" actionTitle="Ready to help build the future of climate intelligence?"
        [isBackgroundTransparent]="true"></app-call-to-action>
</section>
